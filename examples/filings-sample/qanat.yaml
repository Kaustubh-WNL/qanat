# A filings panel, and a value factor built on it. Every number is invented.
#
# `seed/make_data.py` writes the two files this reads, deterministically. Nothing
# here touches the network, and no real company appears: the shape is real and the
# values are not.
#
# What makes this project different from `examples/fx-bundled` is one line, and it
# is `time_columns` below. A price has one date. A filing has two: the quarter it
# describes, and the day it became public. Pick the wrong one and the backtest
# reads a profit number weeks before anybody could.
#
#   qanat run
#   qanat backtest --from 2017-06-30 --to 2026-06-30 --rebalance 60d --split 2022-01-01
#
project: filings_sample
store: ./data/qanat.duckdb

universes:
  - id: listed
    index: Thirty synthetic companies, four listing late and six delisting
    symbols: ./universes/companies.csv

stages:
  - id: raw
    kind: raw
    description: filings and prices exactly as the files carry them
  - id: normalized
    kind: normalized
    description: typed, with the filing lag and the amendment flag made explicit
  - id: features
    kind: features
    description: trailing twelve month profit, then what it is worth against the price
  - id: weights
    kind: weights
    description: one table, one portfolio

# ── the clock ────────────────────────────────────────────────────────────────
# Neither `period_end` nor `filed_at` is a name Qanat recognises on its own, so
# without these two lines both tables would have **no clock at all**. The as-of
# views would not filter them, and every replay would read every filing ever made,
# including the ones published after the day it is pretending to be.
#
# `filed_at` is the right column because it is the day the number became knowable.
# `period_end` is what the number is about, which is a different question and never
# a permission to see it.
time_columns:
  raw.filings: filed_at
  normalized.filings: filed_at

sources:
  - id: filings
    to: [raw.filings]
    connector: csv
    mode: replace
    key: [symbol, period_end, filed_at]
    options:
      path: ./data/filings.csv.gz
      dtype: { symbol: str, form: str }
      parse_dates: [period_end, filed_at]

  - id: prices
    to: [raw.prices]
    connector: csv
    mode: replace
    key: [symbol, date]
    options:
      path: ./data/prices.csv.gz
      dtype: { symbol: str }
      parse_dates: [date]

steps:
  - id: normalize_prices
    from: [raw.prices]
    to:   [normalized.prices]
    script: steps/normalize_prices.sql

  - id: normalize_filings
    from: [raw.filings]
    to:   [normalized.filings]
    script: steps/normalize_filings.sql

  - id: fundamentals
    from: [normalized.filings]
    to:   [features.fundamentals]
    script: steps/fundamentals.sql

  - id: value
    from: [features.fundamentals, normalized.prices]
    to:   [features.value]
    script: steps/value.sql

  - id: value_tilt
    from: [features.value]
    to:   [weights.value_tilt]
    script: steps/value_tilt.py
    universe: listed
    rebalance: 60d
    options:
      long_n: 6
      # Long only. `short_n: 6` makes it half long and half short, and then the
      # benchmark lines in the report are measuring a different thing than the book.
      short_n: 0
      # A company that has not filed in seven months is not priced on anything
      # current, so it is dropped rather than ranked on a stale profit.
      max_staleness_days: 210
      # A name that has not traded in this long has stopped trading.
      max_price_age_days: 10

backtest:
  prices: normalized.prices
  price_column: close
  symbol_column: symbol
  date_column: date
  # Equities, not FX. Five and five is a plausible round trip for a liquid name and
  # a flattering one for a small one.
  fee_bps: 5
  slippage_bps: 5
  # Filings arrive quarterly, so a portfolio that turns over faster than that is
  # trading on the price and not on the filing.
  rebalance: 60d
  purge: 0d
  embargo: 0d
  split: '2022-01-01'
  # The harder floor of the two: the pool the step was choosing from, held equally,
  # as it stood on each decision day. It asks what the ranking was worth rather
  # than what the market was worth.
  benchmark: universe_equal_weight
  bar:
    rule: floor
    t_floor: 2.0
    gate: false
